name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    env:
      OPENCODE_ALLOWED_USER_ID: ${{ vars.OPENCODE_ALLOWED_USER_ID }}
      OPENCODE_BOT_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN }}
      OPENCODE_DATA: ${{ vars.OPENCODE_DATA }}
      OPENCODE_MODELS: ${{ vars.OPENCODE_MODELS }}
      OPENCODE_SSH_KEY: ${{ secrets.OPENCODE_SSH_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_VERTEX_LOCATION: ${{ vars.GOOGLE_VERTEX_LOCATION || 'global' }}
      GOOGLE_VERTEX_PROJECT: ${{ vars.GOOGLE_VERTEX_PROJECT }}
      GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
      GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
      TELEGRAM_BOT_API_DATA: ${{ vars.TELEGRAM_BOT_API_DATA }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate compose variables
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          while read -r var; do
            if [ "$var" = "HOME" ]; then
              continue
            fi

            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done < <(
            grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' docker-compose.yml \
              | sed -E 's/^\$\{//; s/\}$//' \
              | sort -u
          )

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required compose variables: ${missing[*]}"
            exit 1
          fi

          echo "All required compose variables are defined."

      - name: Prepare data directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OPENCODE_DATA/data" "$OPENCODE_DATA/repos" "$OPENCODE_DATA/uploads" "$OPENCODE_DATA/docker"

      - name: Deploy
        shell: bash
        run: docker compose up -d --build --remove-orphans

      - name: Pull child images into the base daemon
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T opencode docker pull ghcr.io/kithlo-server/coder-worker:latest
          docker compose exec -T opencode docker pull ghcr.io/kithlo-server/coder-shell:latest

      - name: Show container status
        if: always()
        shell: bash
        run: docker compose ps -a
